# 云效 Flow 流水线定义 — star-park Node.js CI/CD
#
# 该文件是流水线的版本化副本，便于 review 与追溯。
# 云效侧的实际流水线通过 API/控制台维护，修改后请同步更新本文件。
#
# 组织: 625d2340cfea268afc2158c5   仓库: StartParadise
# 目标机器组: star-park-prod (359190) -> ECS 8.147.58.185 (cn-wulanchabu)
# 生产端口: 3002（3001 已被无关线上应用 game-guess 占用，禁止复用）
name: star-park-nodejs-cicd
sources:
  star_park_repo:
    type: codeup
    name: StartParadise
    endpoint: https://codeup.aliyun.com/625d2340cfea268afc2158c5/StartParadise.git
    branch: main
    certificate:
      type: serviceConnection
      # 必须是服务连接 uuid（数字 id 935415 会被校验拒绝）
      serviceConnection: dppdxrk3h4a4d88w
stages:
  check_stage:
    name: 代码检查
    jobs:
      lint_job:
        name: 架构与质量 lint
        runsOn: public/cn-beijing
        steps:
          lint_step:
            step: Command
            name: 分层依赖与代码质量检查
            with:
              # 构建镜像为 Ubuntu 16.04，只提供 Python 3.5（apt 无更高版本、
              # 无 docker、pypi 不可达），因此 lint 脚本保持 3.5 兼容，直接用 python3 运行。
              run: |
                set -e
                python3 -V
                python3 scripts/lint-deps.py
                python3 scripts/lint-quality.py
  test_stage:
    name: 单元测试
    jobs:
      test_job:
        name: 后端单元测试
        runsOn: public/cn-beijing
        steps:
          test_step:
            step: NodeBuild
            name: vitest 单测与覆盖率
            with:
              # node_modules 不入库，且历史提交含 macOS arm64 原生二进制，
              # 必须 npm ci 干净安装，禁止复用仓库内依赖。
              # NodeBuild 的 version 字段实测不生效（镜像默认 Node 14.8.0，
              # npm 6 无法解析 lockfileVersion 3），因此用镜像自带 nvm 显式切换。
              version: '20.9.0'
              run: |
                set -e
                export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
                [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true
                echo "-- 镜像已装 node --"; ls "$NVM_DIR/versions/node" 2>/dev/null || true
                nvm install 20 >/dev/null 2>&1 || nvm use 20 >/dev/null 2>&1 || true
                node -v; npm -v
                MAJOR="$(node -p 'process.versions.node.split(".")[0]')"
                [ "$MAJOR" -ge 18 ] || { echo "需要 Node >= 18，当前 $(node -v)" >&2; exit 1; }
                cd star-park/server

                # better-sqlite3 是原生模块：prebuild-install 直连 GitHub Releases 会超时，
                # 回退源码编译又因镜像 g++ 5.4 不支持 -std=c++20 必然失败。
                # 因此跳过安装脚本，改为从 npmmirror 取对应 ABI 的预编译产物。
                BS3_MIRROR="https://registry.npmmirror.com/-/binary/better-sqlite3"
                npm ci --no-audit --no-fund --ignore-scripts

                ABI="$(node -p 'process.versions.modules')"
                BSV="$(node -p "require('./node_modules/better-sqlite3/package.json').version")"
                URL="${BS3_MIRROR}/v${BSV}/better-sqlite3-v${BSV}-node-v${ABI}-linux-x64.tar.gz"
                echo "获取 better-sqlite3 预编译产物: $URL"
                curl -fsSL --retry 3 --retry-delay 2 -o /tmp/bs3.tar.gz "$URL"
                tar -xzf /tmp/bs3.tar.gz -C node_modules/better-sqlite3

                # --ignore-scripts 会跳过安装脚本；esbuild 若存在需确认可用
                node -e "require('better-sqlite3'); console.log('better-sqlite3 可加载')"
                if [ -f node_modules/esbuild/install.js ] && ! node -e "require('esbuild')" >/dev/null 2>&1; then
                  echo "esbuild 未就绪，执行其安装脚本"
                  node node_modules/esbuild/install.js
                fi
                npm run test:coverage
  build_stage:
    name: 构建
    jobs:
      build_job:
        name: 构建与制品打包
        runsOn: public/cn-beijing
        steps:
          build_step:
            step: NodeBuild
            name: 前端构建与制品组装
            with:
              version: '20.9.0'
              run: |
                set -e
                export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
                [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true
                nvm install 20 >/dev/null 2>&1 || nvm use 20 >/dev/null 2>&1 || true
                node -v; npm -v
                MAJOR="$(node -p 'process.versions.node.split(".")[0]')"
                [ "$MAJOR" -ge 18 ] || { echo "需要 Node >= 18，当前 $(node -v)" >&2; exit 1; }
                cd star-park/pc-admin
                npm ci --no-audit --no-fund
                npm run build
                cd ../..
                rm -rf dist-package
                mkdir -p dist-package/server dist-package/pc-admin dist-package/deploy
                cp -r star-park/server/src dist-package/server/
                cp star-park/server/package.json dist-package/server/
                cp star-park/server/package-lock.json dist-package/server/
                cp -r star-park/pc-admin/dist/. dist-package/pc-admin/
                cp deploy/deploy.sh deploy/rollback.sh deploy/health-check.sh dist-package/deploy/
                cp deploy/star-park-server.service dist-package/deploy/
                chmod +x dist-package/deploy/*.sh
                echo "--- 制品内容 ---"
                find dist-package -maxdepth 2
          upload_step:
            step: ArtifactUpload
            name: 制品上传
            with:
              uploadType: flowPublic
              artifact: star-park-package
              filePath:
                - dist-package/
  deploy_stage:
    name: 部署
    jobs:
      deploy_job:
        name: 主机部署到生产 ECS
        component: VMDeploy
        with:
          artifact: $[stages.build_stage.build_job.upload_step.artifacts.star-park-package]
          machineGroup: '359190'
          artifactDownloadPath: /opt/star-park/package.tgz
          executeUser: root
          pauseStrategy: noPause
          run: |
            set -e
            mkdir -p /opt/star-park
            UNPACK=$(mktemp -d)
            tar -xzf /opt/star-park/package.tgz -C "$UNPACK"
            DEPLOY_SH=$(find "$UNPACK" -maxdepth 3 -type f -name deploy.sh -print -quit)
            [ -n "$DEPLOY_SH" ] || { echo "制品包内未找到 deploy/deploy.sh" >&2; exit 1; }
            # deploy.sh 自身负责：备份数据库、原子切版本、健康检查、失败自动回滚
            APP_PORT=3002 bash "$DEPLOY_SH"
            rm -rf "$UNPACK"
