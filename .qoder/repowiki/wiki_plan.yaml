version: 1
scope:
  include: []
  exclude: []
repowiki:
  template: "product_requirement"
  notes:
    - text: "本 Wiki 面向产品经理、运营及家长等业务角色，聚焦产品价值、用户旅程与业务规则，避免深入技术实现与 API 细节。"
    - text: "星星乐园是面向多孩家庭的激励管理系统，核心机制为'任务打卡 + 双货币激励（金钱+积分）'，所有功能围绕孩子维度独立管理。"
    - text: "业务事实来源以 docs/产品手册.md、docs/PRODUCT_SENSE.md 及 docs/exec-specs/ 下的可执行需求为准；技术实现请链接至 ARCHITECTURE.md、design-docs/ 与 api.md。"
    - text: "撰写时使用业务术语（孩子、任务、打卡、奖励目标、积分、余额、连续打卡、周完成率），并在首次出现时给出定义。"
  documents:
    - title: "产品概览与价值主张"
      goal: "向业务读者说明星星乐园是什么、解决什么问题、核心价值主张及目标用户画像。"
      parent: ""
      hints: "一句话定义；家长与孩子两类用户；游戏化激励、双货币、数据驱动、多孩管理四大价值"
    - title: "核心用户旅程"
      goal: "描述家长初始化系统、孩子每日打卡、家长查看数据与发放积分、奖励目标达成与兑换四个关键旅程。"
      parent: ""
      hints: "旅程地图；关键触点；情绪曲线；业务闭环"
    - title: "功能模块说明"
      goal: "分模块介绍孩子管理、任务管理、打卡系统、奖励目标、积分系统、统计分析的功能与业务意义。"
      parent: ""
      hints: "模块职责；关键属性；业务价值；与其他模块的关系"
    - title: "双货币激励体系"
      goal: "解释金钱余额与积分两套独立系统的设计意图、来源用途、单位与记录方式。"
      parent: ""
      hints: "金钱系统；积分系统；互补关系；财商培养与行为干预"
    - title: "业务规则与术语表"
      goal: "梳理打卡规则、连续打卡计算、周完成率计算、积分规则、任务删除规则，并提供统一术语表。"
      parent: ""
      hints: "规则清单；计算公式；异常处理；术语中英对照"
    - title: "产品数据看板"
      goal: "说明 PC 管理后台与小程序端提供的核心数据指标及其业务解读方式。"
      parent: ""
      hints: "仪表盘指标；统计页指标；小程序端指标；数据驱动家长决策"
    - title: "当前状态与演进方向"
      goal: "总结已上线功能清单与潜在演进方向，便于业务规划与优先级讨论。"
      parent: ""
      hints: "已实现功能；待完善方向；产品路线图"
knowledgecard:
  notes:
    - text: "知识卡片应聚焦业务领域实体：孩子、任务、打卡、奖励目标、积分、交易，以及它们之间的业务关系。"
    - text: "双货币体系是核心领域概念：金钱余额通过 transactions 记录（earn/spend），用于奖励目标兑换；积分通过 points 记录，由家长手动发放，用于行为激励。"
    - text: "关键业务规则需固化到知识卡片：打卡完成自动更新奖励目标进度、进度达标自动标记 is_achieved、连续打卡从今日或昨日向前回溯、周完成率按活跃任务数计算。"
    - text: "区分家长端（PC 管理后台：任务/奖励/积分/统计管理）与孩子端（小程序/H5：打卡/钱包/进度查看）的功能边界。"
